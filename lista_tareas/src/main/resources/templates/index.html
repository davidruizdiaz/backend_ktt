<!DOCTYPE html>
<html lang="es" xmlns="https://thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tareas</title>
  <style>
    .formulario {
      display: flex;
      justify-content: space-between;
      width: 80%;
      margin: 0 auto;
    }

    h2 {
      text-align: center;
      font-size: 2rem;
    }

    ul {
      width: 80%;
      margin: 0 auto;
    }

    li {
      display: flex;
      height: 30px;
      border-bottom: 1px solid black;
      margin-top: 10px;
    }

    li div {
      width: 60%;
      font-size: 1.1rem;
    }

    .completada {
      text-decoration: line-through;
      color: #ccc;
    }

    @media print {
      .cabecera {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="cabecera">

    <h1>App de Lista de Tareas</h1>

    <hr>

    <div class="formulario">

      <form th:action="@{/guardar}" th:object="${tarea}" method="post">

        <label for="descripcion">Descripcion de la tarea:</label>
        <input type="text" th:field="*{descripcion}" id="descripcion" placeholder="Ingrese la descripción" required>
        <input type="submit" value="Guardar">

      </form>

      <div>
        <button class="btn-pdf">Generar PDF</button>
      </div>

    </div>

    <hr>

  </div>

  <div class="lista">

    <h2>Lista de tareas</h2>

    <ul th:object="${tareas}">
      <li th:each="tar :${tareas}">
        <div>
          <span th:classappend="${tar.completada} ? 'completada' : ''" th:text="${tar.descripcion}"></span>
        </div>

        <form th:if="${tar.completada} == false" th:action="@{/completar/{id}(id=${tar.id})}" method="post">
          <input type="submit" value="✓">
        </form>
        <form th:if="${tar.completada} == true" th:action="@{/eliminar/{id}(id=${tar.id})}" method="post">
          <input type="submit" value="␡">
        </form>
      </li>
    </ul>

  </div>

  <script>
    const btnPdf = document.querySelector('.btn-pdf');
    btnPdf.addEventListener('click', generarPdf);

    function generarPdf() {
      window.print();
    }
  </script>

</body>

</html>
